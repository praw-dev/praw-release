concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    name: ${{ matrix.env }} check
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        env:
          - lint
          - type
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0
      - name: Run check
        env:
          TOX_ENV: ${{ matrix.env }}
        run: uv run --frozen tox run -e "$TOX_ENV"
  test:
    name: test with ${{ matrix.env }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        env:
          - "3.14"
        os:
          - ubuntu-latest
          - macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0
      - name: Run test suite
        env:
          PYTHON_VERSION: ${{ matrix.env }}
        run: uv run --frozen tox run -e "py${PYTHON_VERSION//./}"
name: run tox
on:
  workflow_dispatch:
  push:
    branches: ["main"]
  pull_request:
permissions:
  contents: read
